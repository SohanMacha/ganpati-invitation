<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<meta name="description" content="Ganpati Bappa Morya - Ganesh Utsav Invitation">

<title>Ganpati Bappa Morya | Ganesh Utsav</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Montserrat:wght@300;400;500;600;700&family=Rozha+One&display=swap');

:root{
    --black:#030303;
    --black2:#080808;
    --green:#071810;
    --green2:#0d291b;
    --gold:#d4af37;
    --gold-light:#fff0a6;
    --gold-bright:#ffe37a;
    --gold-dark:#8b6914;
    --cream:#fff9df;
    --muted:#c5c5b7;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 50% -10%,#4d3b0d 0%,transparent 32%),
        radial-gradient(circle at 0% 50%,#123521 0%,transparent 35%),
        radial-gradient(circle at 100% 90%,#123521 0%,transparent 35%),
        linear-gradient(180deg,#020202,#07150d 55%,#020202);
    color:var(--cream);
    font-family:'Montserrat',sans-serif;
    overflow-x:hidden;
}

/* =========================
   GOLDEN AMBIENCE
========================= */

#ambient{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
}

.spark{
    position:absolute;
    bottom:-10px;
    width:3px;
    height:3px;
    border-radius:50%;
    background:var(--gold-light);
    box-shadow:0 0 12px var(--gold);
    animation:rise linear infinite;
    opacity:0;
}

@keyframes rise{
    0%{
        transform:translateY(0) scale(.4);
        opacity:0;
    }
    15%{opacity:.8;}
    80%{opacity:.4;}
    100%{
        transform:translateY(-110vh) scale(1.4);
        opacity:0;
    }
}

/* =========================
   OPENING SCREEN
========================= */

#opening{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;

    background:
        radial-gradient(circle at center,#342909 0%,#07150d 35%,#020202 80%);

    transition:
        opacity 1s ease,
        visibility 1s ease;
}

#opening.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.gold-line{
    position:absolute;
    left:5%;
    right:5%;
    height:1px;
    background:linear-gradient(
        90deg,
        transparent,
        var(--gold),
        var(--gold-light),
        var(--gold),
        transparent
    );
    box-shadow:0 0 15px rgba(212,175,55,.7);
}

.gold-line.top{top:35px;}
.gold-line.bottom{bottom:35px;}

.open-mantra{
    color:var(--gold-light);
    font-family:'Rozha One',serif;
    font-size:17px;
    letter-spacing:3px;
    margin-bottom:30px;
}

.open-ring{
    width:175px;
    height:175px;
    border-radius:50%;
    padding:5px;
    background:linear-gradient(
        135deg,
        #fff5b5,
        #d4af37,
        #7d5b0e,
        #f6d86c
    );
    box-shadow:
        0 0 25px rgba(212,175,55,.45),
        0 0 80px rgba(212,175,55,.18);
    animation:ringPulse 3s ease-in-out infinite;
}

.open-button{
    width:100%;
    height:100%;
    border-radius:50%;
    border:2px solid #fff1a5;
    background:
        radial-gradient(circle,#47370c,#171207 70%);
    color:var(--gold-light);
    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

.open-symbol{
    font-family:'Rozha One',serif;
    font-size:48px;
    line-height:1;
    text-shadow:0 0 20px rgba(255,226,112,.8);
}

.open-button span{
    margin-top:10px;
    font-size:10px;
    font-weight:700;
    letter-spacing:3px;
}

.open-hint{
    margin-top:28px;
    color:#b9b9a9;
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
}

@keyframes ringPulse{
    0%,100%{
        transform:scale(1);
        box-shadow:0 0 25px rgba(212,175,55,.4);
    }
    50%{
        transform:scale(1.045);
        box-shadow:0 0 55px rgba(212,175,55,.75);
    }
}

/* =========================
   PAGE
========================= */

.page{
    position:relative;
    z-index:2;
    width:100%;
    max-width:540px;
    margin:auto;
    padding:22px 13px 55px;
}

.card{
    position:relative;
    padding:42px 20px 30px;

    background:
        linear-gradient(
            145deg,
            rgba(20,31,22,.97),
            rgba(5,9,7,.98)
        );

    border:1px solid rgba(212,175,55,.65);
    border-radius:30px;

    box-shadow:
        0 30px 90px rgba(0,0,0,.9),
        inset 0 0 50px rgba(212,175,55,.06);
}

/* Luxury border */
.card:before{
    content:"";
    position:absolute;
    inset:7px;
    border:1px solid rgba(212,175,55,.2);
    border-radius:24px;
    pointer-events:none;
}

/* Corners */
.corner{
    position:absolute;
    width:34px;
    height:34px;
    border-color:var(--gold);
    border-style:solid;
    z-index:3;
}

.tl{
    top:13px;
    left:13px;
    border-width:2px 0 0 2px;
    border-radius:8px 0 0 0;
}

.tr{
    top:13px;
    right:13px;
    border-width:2px 2px 0 0;
    border-radius:0 8px 0 0;
}

.bl{
    bottom:13px;
    left:13px;
    border-width:0 0 2px 2px;
    border-radius:0 0 0 8px;
}

.br{
    bottom:13px;
    right:13px;
    border-width:0 2px 2px 0;
    border-radius:0 0 8px 0;
}

/* =========================
   HEADER
========================= */

.mantra{
    text-align:center;
    color:var(--gold-light);
    font-family:'Rozha One',serif;
    font-size:15px;
    letter-spacing:2px;
    margin-bottom:13px;
}

.title{
    text-align:center;
    font-family:'Rozha One',serif;
    font-size:34px;
    line-height:1.15;

    background:
        linear-gradient(
            135deg,
            #fff6bd 0%,
            #f5d768 30%,
            #d4af37 55%,
            #8b6813 100%
        );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    filter:drop-shadow(0 4px 10px rgba(0,0,0,.7));
}

.subtitle{
    text-align:center;
    margin-top:8px;
    font-family:'Cinzel',serif;
    font-size:14px;
    font-weight:700;
    letter-spacing:4px;
    color:var(--gold-light);
}

/* =========================
   GANPATI AREA
========================= */

.ganpati-section{
    position:relative;
    margin:28px auto 20px;
    width:270px;
    height:300px;
}

.ganpati-frame{
    position:absolute;
    inset:0;
    padding:9px;

    border-radius:145px 145px 22px 22px;

    background:
        linear-gradient(
            135deg,
            #fff1a2,
            #d4af37,
            #7d5b0e,
            #f2d35e
        );

    box-shadow:
        0 0 35px rgba(212,175,55,.35),
        0 18px 45px rgba(0,0,0,.8);
}

.ganpati-inner{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;

    border-radius:136px 136px 15px 15px;

    background:
        radial-gradient(circle at 50% 35%,#2b421c,#07140d 65%);
}

.ganpati-inner:after{
    content:"";
    position:absolute;
    inset:8px;
    border:1px dashed rgba(255,226,116,.45);
    border-radius:130px 130px 12px 12px;
    pointer-events:none;
}

.ganpati-svg{
    position:absolute;
    width:100%;
    height:100%;
    z-index:2;
    animation:ganpatiFloat 4s ease-in-out infinite alternate;
}

@keyframes ganpatiFloat{
    from{transform:translateY(0);}
    to{transform:translateY(-6px);}
}

/* Flower layer */
#flowerLayer{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:10;
}

.flower{
    position:absolute;
    top:-40px;
    font-size:25px;
    animation:flowerFall linear forwards;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.7));
}

@keyframes flowerFall{
    0%{
        transform:
            translateY(-40px)
            rotate(0deg)
            scale(.7);
        opacity:0;
    }

    10%{
        opacity:1;
    }

    80%{
        opacity:1;
    }

    100%{
        transform:
            translateY(330px)
            rotate(600deg)
            scale(1.1);
        opacity:0;
    }
}

/* Glitter */
.glitter{
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    background:#fff4a8;
    box-shadow:
        0 0 8px #fff0a0,
        0 0 16px #d4af37;
    z-index:11;
    pointer-events:none;

    animation:glitterBurst 1.4s ease-out forwards;
}

@keyframes glitterBurst{
    0%{
        transform:translate(0,0) scale(0);
        opacity:1;
    }
    100%{
        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(.2);
        opacity:0;
    }
}

/* =========================
   FLOWER BUTTON
========================= */

.flower-button{
    display:block;
    margin:12px auto 25px;

    border:1px solid #e3c65a;
    border-radius:40px;

    padding:14px 23px;

    background:
        linear-gradient(
            135deg,
            #3b2c08,
            #171207
        );

    color:var(--gold-light);

    font-family:'Cinzel',serif;
    font-size:11px;
    font-weight:700;
    letter-spacing:1.2px;

    cursor:pointer;

    box-shadow:
        0 0 20px rgba(212,175,55,.15),
        inset 0 0 15px rgba(212,175,55,.08);

    transition:.25s;
}

.flower-button:active{
    transform:scale(.95);
}

.flower-button:hover{
    box-shadow:
        0 0 30px rgba(212,175,55,.35);
}

/* =========================
   SECTION HEADINGS
========================= */

.section{
    display:flex;
    align-items:center;
    gap:11px;

    margin:30px 0 17px;

    color:var(--gold-light);

    font-family:'Cinzel',serif;
    font-size:14px;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
}

.section:before,
.section:after{
    content:"";
    flex:1;
    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--gold),
            transparent
        );
}

/* =========================
   FAMILY PHOTO
========================= */

.photo-frame{
    width:100%;
    max-width:275px;
    margin:auto;
    padding:6px;

    background:
        linear-gradient(
            135deg,
            #fff0a2,
            #d4af37,
            #805f11,
            #f4d45e
        );

    border-radius:20px;

    box-shadow:
        0 18px 40px rgba(0,0,0,.8);
}

.photo-frame img{
    display:block;
    width:100%;
    height:auto;
    border-radius:15px;
    background:#050805;
}

/* =========================
   HOST
========================= */

.host{
    display:block;
    width:fit-content;
    max-width:100%;
    margin:23px auto 5px;

    padding:12px 20px;

    border:1px solid rgba(212,175,55,.4);
    border-radius:30px;

    background:rgba(212,175,55,.06);

    text-align:center;
}

.host-label{
    color:#aaa99a;
    font-size:9px;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:5px;
}

.host-name{
    color:var(--gold-light);
    font-size:14px;
    font-weight:700;
}

/* =========================
   COUNTDOWN
========================= */

.countdown{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
}

.time-box{
    padding:13px 4px;

    text-align:center;

    border:1px solid rgba(212,175,55,.28);
    border-radius:14px;

    background:rgba(255,255,255,.025);
}

.time-box strong{
    display:block;
    color:var(--gold-light);
    font-size:21px;
    font-weight:700;
}

.time-box span{
    display:block;
    margin-top:4px;
    color:#aaa99a;
    font-size:8px;
    letter-spacing:1px;
}

/* =========================
   EVENTS
========================= */

.events{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.event{
    display:flex;
    align-items:center;
    gap:14px;

    padding:16px;

    border:1px solid rgba(212,175,55,.25);
    border-radius:17px;

    background:
        linear-gradient(
            135deg,
            rgba(212,175,55,.05),
            rgba(255,255,255,.015)
        );
}

.event-icon{
    min-width:46px;
    width:46px;
    height:46px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #fff0a0,
            #d4af37,
            #8b6813
        );

    color:#241a04;

    font-size:21px;

    box-shadow:
        0 5px 15px rgba(0,0,0,.5);
}

.event h3{
    color:var(--gold-light);
    font-size:14px;
    margin-bottom:5px;
}

.event p{
    color:var(--cream);
    font-size:12.5px;
    line-height:1.5;
}

.highlight{
    color:var(--gold-bright);
    font-weight:700;
}

/* =========================
   LOCATION
========================= */

.location{
    padding:20px 15px;
    text-align:center;

    border:1px solid rgba(212,175,55,.28);
    border-radius:18px;

    background:rgba(255,255,255,.025);
}

.location-symbol{
    font-size:28px;
    margin-bottom:9px;
}

.address{
    color:var(--cream);
    font-size:13.5px;
    line-height:1.65;
    margin-bottom:18px;
}

.map-button{
    display:block;

    padding:14px;

    border-radius:30px;

    text-decoration:none;

    color:#1d1504;

    font-size:12px;
    font-weight:800;
    letter-spacing:1px;

    background:
        linear-gradient(
            135deg,
            #fff0a0,
            #d4af37,
            #a67c13
        );

    box-shadow:
        0 8px 20px rgba(212,175,55,.25);
}

/* =========================
   ACTION BUTTONS
========================= */

.actions{
    display:flex;
    gap:10px;
}

.action{
    flex:1;

    padding:13px 8px;

    border-radius:30px;

    border:1px solid rgba(212,175,55,.4);

    background:rgba(212,175,55,.06);

    color:var(--gold-light);

    font-weight:700;
    font-size:11px;

    cursor:pointer;
}

/* =========================
   MESSAGE
========================= */

.message{
    margin-top:26px;

    text-align:center;

    color:#bcbcaf;

    font-size:12.5px;
    line-height:1.75;

    font-style:italic;
}

.footer{
    margin-top:20px;
    text-align:center;

    color:var(--gold);

    font-size:19px;
    letter-spacing:7px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:380px){

    .page{
        padding-left:8px;
        padding-right:8px;
    }

    .card{
        padding-left:15px;
        padding-right:15px;
    }

    .title{
        font-size:28px;
    }

    .ganpati-section{
        width:245px;
        height:275px;
    }

}
</style>
</head>

<body>

<!-- Ambient particles -->
<div id="ambient"></div>


<!-- =========================
     OPENING
========================= -->

<div id="opening">

    <div class="gold-line top"></div>
    <div class="gold-line bottom"></div>

    <div class="open-mantra">
        ॥ ॐ गं गणपतये नमः ॥
    </div>

    <div class="open-ring">

        <button
            class="open-button"
            onclick="openInvitation()"
        >

            <div class="open-symbol">ॐ</div>

            <span>
                OPEN INVITATION
            </span>

        </button>

    </div>

    <div class="open-hint">
        Tap to enter
    </div>

</div>


<!-- =========================
     MAIN PAGE
========================= -->

<main class="page">

<div class="card">

    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>


    <!-- Header -->

    <div class="mantra">
        ॥ श्री गणेशाय नमः ॥
    </div>

    <h1 class="title">
        गणपती बाप्पा मोरया
    </h1>

    <div class="subtitle">
        GANPATI BAPPA MORYA
    </div>


    <!-- Ganpati -->

    <div class="ganpati-section">

        <div class="ganpati-frame">

            <div class="ganpati-inner">

                <div id="flowerLayer"></div>

                <svg
                    class="ganpati-svg"
                    viewBox="0 0 220 260"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <defs>

                        <linearGradient
                            id="gold"
                            x1="0%"
                            y1="0%"
                            x2="100%"
                            y2="100%"
                        >
                            <stop
                                offset="0%"
                                stop-color="#fff5bd"
                            />

                            <stop
                                offset="42%"
                                stop-color="#d4af37"
                            />

                            <stop
                                offset="100%"
                                stop-color="#806012"
                            />
                        </linearGradient>

                        <filter id="goldGlow">

                            <feGaussianBlur
                                stdDeviation="1.5"
                                result="blur"
                            />

                            <feMerge>

                                <feMergeNode
                                    in="blur"
                                />

                                <feMergeNode
                                    in="SourceGraphic"
                                />

                            </feMerge>

                        </filter>

                    </defs>


                    <!-- Halo -->

                    <circle
                        cx="110"
                        cy="115"
                        r="88"
                        fill="none"
                        stroke="url(#gold)"
                        stroke-width="1.5"
                        stroke-dasharray="4 5"
                        opacity=".65"
                    />

                    <circle
                        cx="110"
                        cy="115"
                        r="76"
                        fill="none"
                        stroke="url(#gold)"
                        stroke-width="1"
                        opacity=".35"
                    />


                    <!-- Crown -->

                    <path
                        d="M70 72 L110 15 L150 72 Q110 55 70 72Z"
                        fill="url(#gold)"
                    />

                    <path
                        d="M84 52 L110 15 L136 52"
                        fill="none"
                        stroke="url(#gold)"
                        stroke-width="3"
                    />

                    <circle
                        cx="110"
                        cy="14"
                        r="4"
                        fill="#fff2a0"
                        filter="url(#goldGlow)"
                    />


                    <!-- Ears -->

                    <path
                        d="M76 82 C35 62 28 130 69 141"
                        fill="none"
                        stroke="url(#gold)"
                        stroke-width="5"
                        stroke-linecap="round"
                    />

                    <path
                        d="M144 82 C185 62 192 130 151 141"
                        fill="none"
                        stroke="url(#gold)"
                        stroke-width="5"
                        stroke-linecap="round"
                    />


                    <!-- Head -->

                    <path
                        d="M72 82
                           Q110 63 148 82
                           Q158 108 147 131
                           Q137 149 110 151
                           Q83 149 73 131
                           Q62 108 72 82Z"
                        fill="none"
                        stroke="url(#gold)"
                        stroke-width="3"
                    />


                    <!-- Tilak -->

                    <path
                        d="M110 51 L110 80"
