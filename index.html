<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>गणपती बाप्पा मोरया | Ganpati Utsav 2026</title>

<meta name="theme-color" content="#03140c">
<meta name="description" content="Ganpati Utsav 2026 - You are cordially invited to celebrate with us.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Montserrat:wght@300;400;500;600;700&family=Noto+Serif+Devanagari:wght@400;600;700&family=Rozha+One&family=Yatra+One&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

/* =========================================================
   ROOT
========================================================= */

:root{
  --green:#03140c;
  --green2:#062016;
  --green3:#0b3020;
  --green4:#10442c;

  --gold:#d4af37;
  --gold2:#f3d66b;
  --gold3:#fff2a7;
  --goldDark:#76540d;

  --cream:#fff9e2;
  --muted:#c8d5cd;

  --red:#b92d27;

  --glass:rgba(4,25,16,.84);
  --glass2:rgba(255,255,255,.045);

  --border:rgba(212,175,55,.34);
}

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  overflow-x:hidden;

  background:
    radial-gradient(circle at 50% 0%,#165537 0%,transparent 32%),
    radial-gradient(circle at 100% 50%,#0b2b1d 0%,transparent 35%),
    radial-gradient(circle at 0% 80%,#0a291b 0%,transparent 40%),
    linear-gradient(180deg,#020a06,#061b12 50%,#020a06);

  color:var(--cream);

  font-family:'Montserrat',sans-serif;
}

/* =========================================================
   PETAL / PARTICLE LAYER
========================================================= */

#particles{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:1;
}

.particle{
  position:absolute;
  top:-40px;
  opacity:0;

  animation:
    petalFall linear infinite;
}

@keyframes petalFall{

  0%{
    transform:
      translateY(-40px)
      translateX(0)
      rotate(0deg);

    opacity:0;
  }

  10%{
    opacity:.9;
  }

  85%{
    opacity:.45;
  }

  100%{
    transform:
      translateY(110vh)
      translateX(80px)
      rotate(480deg);

    opacity:0;
  }
}

/* =========================================================
   OPENING SCREEN
========================================================= */

#opening{
  position:fixed;
  inset:0;

  z-index:9999;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  background:
    radial-gradient(
      circle at center,
      #174d34 0%,
      #08291b 38%,
      #020b07 78%
    );

  transition:
    opacity 1.2s ease,
    transform 1.2s ease,
    visibility 1.2s ease;
}

#opening.hide{
  opacity:0;
  visibility:hidden;
  transform:scale(1.08);
}

.opening-inner{
  width:90%;
  max-width:430px;

  animation:openingAppear 1.4s ease;
}

@keyframes openingAppear{
  from{
    opacity:0;
    transform:translateY(35px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.opening-om{
  font-family:'Noto Serif Devanagari',serif;
  font-size:19px;
  color:var(--gold3);

  text-shadow:
    0 0 15px rgba(243,214,107,.65);

  margin-bottom:20px;
}

.opening-lotus{
  font-size:30px;
  margin-bottom:10px;
}

.opening-title{
  font-family:'Yatra One','Rozha One',serif;
  font-size:40px;
  line-height:1.15;

  background:
    linear-gradient(
      135deg,
      #fff7c8,
      #f3d66b 35%,
      #d4af37 65%,
      #8b6513
    );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  filter:
    drop-shadow(0 4px 12px rgba(0,0,0,.65));
}

.opening-subtitle{
  margin-top:8px;

  font-family:'Cinzel',serif;
  font-size:11px;

  color:var(--gold3);
  letter-spacing:4px;
}

.opening-line{
  width:180px;
  height:1px;

  margin:25px auto;

  background:
    linear-gradient(
      90deg,
      transparent,
      var(--gold),
      transparent
    );
}

.open-button{
  width:132px;
  height:132px;

  border-radius:50%;
  border:2px solid var(--gold3);

  background:
    radial-gradient(
      circle at 35% 30%,
      #fff0a2,
      #d4af37 55%,
      #79560d
    );

  color:#211403;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  margin:auto;

  cursor:pointer;

  box-shadow:
    0 0 25px rgba(212,175,55,.55),
    0 0 70px rgba(212,175,55,.15);

  animation:buttonGlow 2.4s infinite;
}

.open-button i{
  font-size:31px;
  margin-bottom:7px;
}

.open-button span{
  font-size:10px;
  font-weight:800;
  letter-spacing:1.8px;
  text-transform:uppercase;
}

@keyframes buttonGlow{

  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.055);
  }
}

.opening-blessing{
  margin-top:25px;

  font-family:'Noto Serif Devanagari',serif;

  color:#d4ddd7;
  font-size:13px;
}

/* =========================================================
   MUSIC BUTTON
========================================================= */

.music-button{
  position:fixed;

  right:14px;
  bottom:15px;

  width:47px;
  height:47px;

  border-radius:50%;

  border:1px solid rgba(212,175,55,.45);

  background:rgba(4,25,16,.9);

  color:var(--gold3);

  z-index:5000;

  cursor:pointer;

  box-shadow:0 6px 20px rgba(0,0,0,.45);

  display:flex;
  align-items:center;
  justify-content:center;
}

.music-button.playing{
  animation:musicPulse 1.3s infinite;
}

@keyframes musicPulse{

  0%,100%{
    box-shadow:
      0 0 0 rgba(212,175,55,0);
  }

  50%{
    box-shadow:
      0 0 20px rgba(212,175,55,.55);
  }
}

/* =========================================================
   MAIN WRAPPER
========================================================= */

.wrapper{
  position:relative;
  z-index:2;

  width:100%;
  max-width:540px;

  margin:auto;

  padding:
    18px
    14px
    70px;
}

/* =========================================================
   MAIN CARD
========================================================= */

.card{
  position:relative;

  overflow:hidden;

  padding:
    28px
    17px
    38px;

  border-radius:31px;

  border:1px solid var(--border);

  background:
    linear-gradient(
      145deg,
      rgba(8,39,25,.93),
      rgba(3,19,12,.93)
    );

  box-shadow:
    0 25px 90px rgba(0,0,0,.72),
    inset 0 0 60px rgba(212,175,55,.045);

  backdrop-filter:blur(16px);
}

.card:before{
  content:"";

  position:absolute;
  inset:8px;

  border:1px solid rgba(212,175,55,.13);

  border-radius:24px;

  pointer-events:none;
}

.corner{
  position:absolute;

  width:42px;
  height:42px;

  border-color:var(--gold);
  border-style:solid;

  opacity:.75;

  z-index:3;
}

.tl{
  top:14px;
  left:14px;
  border-width:2px 0 0 2px;
  border-radius:9px 0 0 0;
}

.tr{
  top:14px;
  right:14px;
  border-width:2px 2px 0 0;
  border-radius:0 9px 0 0;
}

.bl{
  bottom:14px;
  left:14px;
  border-width:0 0 2px 2px;
  border-radius:0 0 0 9px;
}

.br{
  bottom:14px;
  right:14px;
  border-width:0 2px 2px 0;
  border-radius:0 0 9px 0;
}

/* =========================================================
   HERO
========================================================= */

.hero{
  text-align:center;
}

.om{
  font-family:'Noto Serif Devanagari',serif;

  color:var(--gold3);

  font-size:17px;

  margin-bottom:8px;

  letter-spacing:1px;
}

.main-title{
  font-family:'Yatra One','Rozha One',serif;

  font-size:39px;

  line-height:1.18;

  background:
    linear-gradient(
      135deg,
      #fff5bb 0%,
      #f3d66b 30%,
      #d4af37 60%,
      #80600f 100%
    );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  filter:
    drop-shadow(0 3px 8px rgba(0,0,0,.7));
}

.main-sub{
  font-family:'Cinzel',serif;

  color:var(--gold2);

  font-size:12px;

  letter-spacing:3px;

  margin-top:7px;
}

.decor-line{
  display:flex;
  align-items:center;
  justify-content:center;

  gap:9px;

  margin:18px 5px;

  color:var(--gold2);
}

.decor-line:before,
.decor-line:after{
  content:"";

  height:1px;
  flex:1;

  background:
    linear-gradient(
      90deg,
      transparent,
      var(--gold),
      transparent
    );
}

.decor-line span{
  font-size:12px;
}

/* =========================================================
   GANPATI ART
========================================================= */

.ganpati-stage{
  position:relative;

  width:260px;
  height:295px;

  margin:5px auto 25px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.ganpati-halo{
  position:absolute;

  width:245px;
  height:245px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(212,175,55,.18),
      rgba(212,175,55,.04) 48%,
      transparent 70%
    );

  box-shadow:
    0 0 55px rgba(212,175,55,.18);
}

.ganpati-halo:before{
  content:"";

  position:absolute;

  inset:13px;

  border-radius:50%;

  border:1px dashed rgba(243,214,107,.42);

  animation:spin 35s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.ganpati-svg{
  position:relative;
  z-index:2;

  width:235px;
  height:275px;

  filter:
    drop-shadow(0 15px 17px rgba(0,0,0,.75));

  animation:ganpatiFloat 4s ease-in-out infinite alternate;
}

@keyframes ganpatiFloat{

  from{
    transform:translateY(2px);
  }

  to{
    transform:translateY(-7px);
  }
}

/* =========================================================
   INTRO
========================================================= */

.intro{
  text-align:center;

  padding:4px 8px;
}

.intro-kicker{
  color:var(--gold);

  font-family:'Cinzel',serif;

  font-size:9px;

  letter-spacing:2.5px;

  text-transform:uppercase;
}

.intro h2{
  font-family:'Yatra One','Rozha One',serif;

  color:var(--gold3);

  font-size:27px;

  margin:
    7px
    0
    9px;
}

.intro p{
  font-family:'Noto Serif Devanagari',serif;

  color:var(--muted);

  font-size:14px;

  line-height:1.85;
}

.intro .english{
  margin-top:9px;

  font-family:'Montserrat',sans-serif;

  font-size:12px;

  line-height:1.7;
}

/* =========================================================
   SECTION
========================================================= */

.section{
  margin-top:31px;
}

.section-title{
  display:flex;
  align-items:center;

  gap:9px;

  justify-content:center;

  margin-bottom:17px;

  color:var(--gold3);

  font-family:'Cinzel',serif;

  font-weight:700;

  font-size:13px;

  letter-spacing:1.6px;

  text-transform:uppercase;
}

.section-title:before,
.section-title:after{
  content:"";

  height:1px;

  flex:1;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(212,175,55,.75),
      transparent
    );
}

/* =========================================================
   COUNTDOWN
========================================================= */

.count-card{
  text-align:center;

  padding:19px 9px;

  border-radius:20px;

  border:1px solid rgba(212,175,55,.3);

  background:
    radial-gradient(
      circle at center,
      rgba(212,175,55,.11),
      transparent 68%
    );
}

.count-label{
  font-size:9px;

  letter-spacing:2px;

  color:var(--muted);

  text-transform:uppercase;

  margin-bottom:14px;
}

.countdown{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:7px;
}

.time{
  padding:10px 3px;

  border-radius:13px;

  background:rgba(0,0,0,.27);

  border:1px solid rgba(212,175,55,.17);
}

.time strong{
  display:block;

  color:var(--gold3);

  font-size:22px;

  line-height:1;
}

.time span{
  display:block;

  color:var(--muted);

  font-size:8px;

  margin-top:6px;

  letter-spacing:1px;

  text-transform:uppercase;
}

/* =========================================================
   PHOTO
========================================================= */

.photo-frame{
  max-width:290px;

  margin:auto;

  padding:6px;

  border-radius:21px;

  background:
    linear-gradient(
      135deg,
      #fff1a0,
      #d4af37 45%,
      #805e11
    );

  box-shadow:
    0 17px 40px rgba(0,0,0,.65);
}

.photo-inner{
  overflow:hidden;

  border-radius:16px;

  background:#020a06;
}

.photo-inner img{
  width:100%;

  display:block;

  height:auto;
}

.photo-caption{
  text-align:center;

  margin-top:11px;

  color:var(--gold3);

  font-family:'Noto Serif Devanagari',serif;

  font-size:13px;
}

/* =========================================================
   HOST
========================================================= */

.host-card{
  margin-top:16px;

  padding:16px 12px;

  text-align:center;

  border-radius:20px;

  background:
    linear-gradient(
      135deg,
      rgba(212,175,55,.10),
      rgba(255,255,255,.025)
    );

  border:1px solid rgba(212,175,55,.27);
}

.host-label{
  color:var(--muted);

  font-size:8px;

  letter-spacing:2px;

  text-transform:uppercase;

  margin-bottom:6px;
}

.host-name{
  color:var(--gold3);

  font-weight:700;

  font-size:15px;

  line-height:1.5;
}

/* =========================================================
   TIMELINE
========================================================= */

.timeline{
  padding-left:4px;
}

.event{
  position:relative;

  display:flex;

  gap:12px;

  padding-bottom:17px;
}

.event:last-child{
  padding-bottom:0;
}

.event:not(:last-child):before{
  content:"";

  position:absolute;

  left:20px;

  top:43px;

  bottom:0;

  width:1px;

  background:
    linear-gradient(
      var(--gold),
      transparent
    );
}

.event-icon{
  position:relative;
  z-index:2;

  width:41px;
  height:41px;

  flex:none;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#211502;

  background:
    linear-gradient(
      145deg,
      #fff0a1,
      #d4af37,
      #876313
    );

  box-shadow:
    0 5px 16px rgba(0,0,0,.45);
}

.event-box{
  flex:1;

  padding:11px 12px;

  border-radius:16px;

  background:rgba(255,255,255,.035);

  border:1px solid rgba(212,175,55,.2);
}

.event-date{
  color:var(--gold);

  font-size:9px;

  font-weight:700;

  letter-spacing:1px;

  text-transform:uppercase;
}

.event-box h3{
  color:var(--gold3);

  font-size:14px;

  margin:
    4px
    0
    5px;
}

.event-box p{
  color:var(--muted);

  font-size:12px;

  line-height:1.6;
}

/* =========================================================
   AARTI
========================================================= */

.aarti-grid{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:10px;
}

.aarti{
  padding:17px 8px;

  text-align:center;

  border-radius:18px;

  background:rgba(255,255,255,.035);

  border:1px solid rgba(212,175,55,.22);
}

.aarti i{
  color:var(--gold);

  font-size:19px;

  margin-bottom:7px;
}

.aarti h3{
  color:var(--gold3);

  font-size:11px;

  margin-bottom:5px;
}

.aarti strong{
  font-size:18px;

  color:white;
}

/* =========================================================
   VENUE
========================================================= */

.location-card{
  padding:19px 14px;

  text-align:center;

  border-radius:21px;

  border:1px solid rgba(212,175,55,.27);

  background:
    radial-gradient(
      circle at top,
      rgba(212,175,55,.09),
      transparent 65%
    );
}

.location-icon{
  width:55px;
  height:55px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin:auto;

  border-radius:50%;

  color:#211502;

  background:
    linear-gradient(
      145deg,
      #fff0a1,
      #d4af37,
      #856213
    );

  font-size:21px;

  box-shadow:
    0 7px 20px rgba(0,0,0,.4);
}

.address{
  margin-top:12px;

  color:var(--cream);

  font-size:13px;

  line-height:1.75;
}

.address small{
  display:block;

  color:var(--muted);

  margin-top:5px;
}

.map-button{
  display:flex;

  align-items:center;

  justify-content:center;

  gap:9px;

  margin-top:16px;

  padding:14px;

  border-radius:30px;

  text-decoration:none;

  color:#211502;

  background:
    linear-gradient(
      135deg,
      #fff0a1,
      #d4af37,
      #956e17
    );

  font-size:12px;

  font-weight:800;

  letter-spacing:.4px;
}

/* =========================================================
   ACTIONS
========================================================= */

.actions{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:10px;
}

.action{
  padding:14px 8px;

  border-radius:16px;

  border:1px solid rgba(212,175,55,.3);

  background:rgba(212,175,55,.065);

  color:var(--gold3);

  font-weight:700;

  font-size:11px;

  cursor:pointer;
}

.action i{
  display:block;

  font-size:18px;

  margin-bottom:6px;
}

/* =========================================================
   VISARJAN
========================================================= */

.visarjan{
  text-align:center;

  padding:22px 13px;

  border-radius:23px;

  border:1px solid rgba(212,175,55,.32);

  background:
    radial-gradient(
      circle at center,
      rgba(212,175,55,.11),
      transparent 70%
    );
}

.visarjan-art{
  font-size:31px;

  margin-bottom:8px;
}

.visarjan h3{
  font-family:'Yatra One','Rozha One',serif;

  font-size:27px;

  color:var(--gold3);
}

.visarjan p{
  margin-top:8px;

  color:var(--muted);

  font-family:'Noto Serif Devanagari',serif;

  font-size:13px;

  line-height:1.8;
}

.visarjan-date{
  color:var(--gold3) !important;

  font-family:'Montserrat',sans-serif !important;

  font-weight:700;
}

/* =========================================================
   FINAL BLESSING
========================================================= */

.final-message{
  text-align:center;

  margin-top:30px;

  padding:4px 7px;
}

.final-marathi{
  font-family:'Noto Serif Devanagari',serif;

  color:var(--gold3);

  font-size:17px;

  line-height:1.9;
}

.final-english{
  color:var(--muted);

  font-size:11px;

  line-height:1.7;

  margin-top:8px;
}

/* =========================================================
   FOOTER
========================================================= */

.footer{
  text-align:center;

  margin-top:27px;
}

.footer-mantra{
  font-family:'Yatra One','Rozha One',serif;

  color:var(--gold3);

  font-size:22px;
}

.footer-sub{
  margin-top:6px;

  color:var(--muted);

  font-size:9px;

  letter-spacing:1.7px;
}

.lamps{
  margin-top:13px;

  font-size:19px;

  letter-spacing:3px;
}

/* =========================================================
   TOAST
========================================================= */

#toast{
  position:fixed;

  left:50%;
  bottom:75px;

  transform:
    translate(-50%,25px);

  opacity:0;

  pointer-events:none;

  z-index:10000;

  padding:11px 18px;

  border-radius:30px;

  background:#102d20;

  border:1px solid rgba(212,175,55,.4);

  color:var(--gold3);

  font-size:11px;

  white-space:nowrap;

  transition:.35s;
}

#toast.show{
  opacity:1;

  transform:
    translate(-50%,0);
}

/* =========================================================
   CONFETTI
========================================================= */

.confetti{
  position:fixed;

  top:-30px;

  z-index:10001;

  pointer-events:none;

  animation:
    confettiFall 3.8s linear forwards;
}

@keyframes confettiFall{

  to{
    transform:
      translateY(110vh)
      rotate(720deg);

    opacity:0;
  }
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:370px){

  .main-title{
    font-size:34px;
  }

  .ganpati-stage{
    transform:scale(.92);
    margin-top:-5px;
    margin-bottom:5px;
  }

  .opening-title{
    font-size:35px;
  }

}
